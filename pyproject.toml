[project]
name = "phoemotivepocsensor3d"
version = "0.1.0"
description = "Uses LabStreamingLayer (LSL) to recieve incoming EEG signal quality information for each of the headset sensor pads and renders them on a 3D model of the headset"
readme = "README.md"
requires-python = ">=3.9.13"
dependencies = [
    "ipykernel>=6.29.5",
    "pathlib>=1.0.1",
    "pylsl>=1.17.6",
    "vispy>=0.14.3",
    "trimesh>=3.20.0",
    "pyglet>=2.0.0",
    "numpy>=1.24.0",
    "pyassimp>=5.2.5",
    "pyqt6>=6.9.0",
    "qtpy>=2.4.3",
    "pillow>=11.2.1",
    "dvc[gdrive]>=3.59.1",
    "meshcat>=0.3.2",
    "pyqt5==5.15.11",
    "pyqt5-qt5==5.15.2",
    "pyqt5-sip==12.17.0",
]

[project.optional-dependencies]
visualization = [
    "ipykernel>=6.29.5",
    "jupyter-server-proxy>=4.4.0",
    "matplotlib>=3.9.4",
    "meshio>=5.3.5",
    "numpy>=2.0.2",
    "pythreejs>=2.4.2",
    "pyvista[all]>=0.45.0",
    "pyvistaqt>=0.11.2",
    "scipy>=1.13.1",
    "scooby>=0.10.1",
    "tqdm>=4.67.1",
    "trame>=3.9.0",
    "trimesh>=4.6.6",
]


[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
